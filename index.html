<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chat Game - Mobile &amp; Desktop</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #2e8b57;
        font-family: sans-serif;
        user-select: none;
        touch-action: none;
      }
      #menuOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(18, 18, 18, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
      }
      .menu-card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        border: 1px solid #333;
        max-width: 90%;
        width: 350px;
      }
      .menu-btn {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      .keyboard-btn {
        background: #007bff;
        color: white;
      }
      .touch-btn {
        background: #ff9f43;
        color: white;
      }
      .menu-btn:hover {
        opacity: 0.9;
        transform: scale(1.02);
      }

      .chat-container {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 280px;
        height: 200px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        z-index: 100;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .chat-box {
        flex: 1;
        padding: 8px;
        overflow-y: auto;
        color: white;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .input-area {
        display: flex;
        border-top: 1px solid #444;
      }
      input {
        flex: 1;
        padding: 10px;
        border: none;
        background: #222;
        color: #fff;
        outline: none;
        font-size: 13px;
      }
      button {
        padding: 10px 14px;
        border: none;
        background: #00ff88;
        color: #121212;
        cursor: pointer;
        font-weight: bold;
      }

      #mobileControls {
        display: none;
        position: absolute;
        bottom: 40px;
        right: 40px;
        width: 150px;
        height: 150px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 50%;
        z-index: 200;
        touch-action: none;
      }
      .dpad-btn {
        position: absolute;
        width: 45px;
        height: 45px;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: #121212;
        font-size: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      #btnUp {
        top: 5px;
        left: 52px;
      }
      #btnDown {
        bottom: 5px;
        left: 52px;
      }
      #btnLeft {
        top: 52px;
        left: 5px;
      }
      #btnRight {
        top: 52px;
        right: 5px;
      }

      .player {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition:
          top 0.05s linear,
          left 0.05s linear;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }
      .player-label {
        position: absolute;
        top: -25px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        white-space: nowrap;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="menuOverlay">
      <div class="menu-card">
        <h2>⚔️ Choose Your Controls ⚔️</h2>
        <p style="color: #aaa; font-size: 14px">Select how you want to move your character on the green plot.</p>
        <button class="menu-btn keyboard-btn" onclick="startGame('keyboard')">⌨️ Keyboard (WASD / Arrows)</button>
        <button class="menu-btn touch-btn" onclick="startGame('touch')">📱 Touch Screen (Mobile)</button>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <div style="color: #00ff88">
          <b>System:</b>
          Welcome! Enjoy the green plot.
        </div>
      </div>
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Tap to chat..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div id="mobileControls">
      <div class="dpad-btn" id="btnUp">↑</div>
      <div class="dpad-btn" id="btnDown">↓</div>
      <div class="dpad-btn" id="btnLeft">←</div>
      <div class="dpad-btn" id="btnRight">→</div>
    </div>

    <div class="player" id="localPlayer" style="background: #ff4757; top: 300px; left: 400px">
      <div class="player-label" id="localLabel">Player</div>
    </div>
    <script>
      let username = "Hero";
      let controlType = "keyboard";
      const playerId = "p_" + Math.floor(Math.random() * 999999);

      let playerX = window.innerWidth / 2;
      let playerY = window.innerHeight / 2;
      const speed = 20;
      const remotePlayers = {};

      const localPlayer = document.getElementById("localPlayer");
      localPlayer.style.top = playerY + "px";
      localPlayer.style.left = playerX + "px";

      const socket = new WebSocket("wss://stream.ably.io/html5-chat-game-demo?anonymous=true");
      const fallbackChannel = new BroadcastChannel("local_game_room");

      function startGame(choice) {
        controlType = choice;
        username = prompt("Enter your Name:") || "Hero";
        document.getElementById("localLabel").innerText = username;
        document.getElementById("menuOverlay").style.display = "none";

        if (controlType === "touch") {
          document.getElementById("mobileControls").style.display = "block";
          setupMobileTouchListeners();
        }
      }

      function handleData(data) {
        if (data.id === playerId) return;
        if (data.type === "chat") addChatMessage(data.user, data.message);
        if (data.type === "move") updateRemotePlayer(data);
      }

      socket.onmessage = (e) => {
        try {
          handleData(JSON.parse(e.data));
        } catch (err) {}
      };
      fallbackChannel.onmessage = (e) => handleData(e.data);

      function sendPayload(payload) {
        if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(payload));
        fallbackChannel.postMessage(payload);
      }

      function updateRemotePlayer(data) {
        let pEl = remotePlayers[data.id];
        if (!pEl) {
          pEl = document.createElement("div");
          pEl.className = "player";
          pEl.style.background = "#3742fa";
          const label = document.createElement("div");
          label.className = "player-label";
          pEl.appendChild(label);
          document.body.appendChild(pEl);
          remotePlayers[data.id] = pEl;
        }
        pEl.querySelector(".player-label").innerText = data.user;
        pEl.style.top = data.y + "px";
        pEl.style.left = data.x + "px";
      }

      function addChatMessage(user, message) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.innerHTML = `<b>${user}:</b> ${message}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function sendChat() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;

        addChatMessage(username, text);
        sendPayload({ type: "chat", id: playerId, user: username, message: text });
        input.value = "";
        input.blur();
      }

      function movePlayer(dx, dy) {
        playerX += dx;
        playerY += dy;
        playerX = Math.max(10, Math.min(window.innerWidth - 50, playerX));
        playerY = Math.max(10, Math.min(window.innerHeight - 50, playerY));

        localPlayer.style.top = playerY + "px";
        localPlayer.style.left = playerX + "px";

        sendPayload({ type: "move", id: playerId, user: username, x: playerX, y: playerY });
      }

      window.addEventListener("keydown", (e) => {
        if (controlType !== "keyboard" || document.activeElement === document.getElementById("msgInput")) return;
        const key = e.key.toLowerCase();
        if (key === "arrowup" || key === "w") movePlayer(0, -speed);
        if (key === "arrowdown" || key === "s") movePlayer(0, speed);
        if (key === "arrowleft" || key === "a") movePlayer(-speed, 0);
        if (key === "arrowright" || key === "d") movePlayer(speed, 0);
      });

      function setupMobileTouchListeners() {
        const directions = {
          btnUp: [0, -speed],
          btnDown: [0, speed],
          btnLeft: [-speed, 0],
          btnRight: [speed, 0],
        };
        Object.keys(directions).forEach((id) => {
          const btn = document.getElementById(id);
          btn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const [dx, dy] = directions[id];
            movePlayer(dx, dy);
          });
        });
      }

      document.getElementById("sendBtn").addEventListener("click", sendChat);
      document.getElementById("msgInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendChat();
      });
      document.addEventListener("click", (e) => {
        if (e.target.id !== "msgInput" && e.target.id !== "sendBtn") document.getElementById("msgInput").blur();
      });
    </script>
  </body>
</html>
