<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Game - Fixed Multiplayer</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #2e8b57; /* Green Plot Floor */
        font-family: sans-serif;
        user-select: none;
      }

      /* Top Left Chat Box */
      .chat-container {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 320px;
        height: 280px;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        z-index: 100;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .chat-box {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        color: white;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .input-area {
        display: flex;
        border-top: 1px solid #444;
      }
      input {
        flex: 1;
        padding: 12px;
        border: none;
        background: #222;
        color: #fff;
        outline: none;
        font-size: 14px;
      }
      button {
        padding: 12px 18px;
        border: none;
        background: #00ff88;
        color: #121212;
        cursor: pointer;
        font-weight: bold;
      }

      /* Player Circle Styles */
      .player {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition:
          top 0.05s linear,
          left 0.05s linear;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }
      .player-label {
        position: absolute;
        top: -25px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Chat Box -->
    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <div style="color: #00ff88">
          <b>System:</b>
          Click the green grass first, then use Arrow keys or WASD to move!
        </div>
      </div>
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Press Enter to chat..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <!-- Local Player Circle -->
    <div class="player" id="localPlayer" style="background: #ff4757; top: 300px; left: 400px">
      <div class="player-label" id="localLabel">Hero</div>
    </div>

    <script>
      const username = prompt("Enter your Name:") || "Hero";
      const playerId = "p_" + Math.floor(Math.random() * 999999);
      document.getElementById("localLabel").innerText = username;

      let playerX = 400;
      let playerY = 300;
      const speed = 20;
      const remotePlayers = {};

      // Free, zero-setup public WebSocket relay for HTML games
      const socket = new WebSocket("wss://stream.ably.io/html5-chat-game-demo?anonymous=true");
      // Fallback engine if connection is throttled
      const fallbackChannel = new BroadcastChannel("local_game_room");

      function handleData(data) {
        if (data.id === playerId) return; // Ignore own messages

        if (data.type === "chat") {
          addChatMessage(data.user, data.message);
        } else if (data.type === "move") {
          updateRemotePlayer(data);
        }
      }

      socket.onmessage = function (event) {
        try {
          const data = JSON.parse(event.data);
          handleData(data);
        } catch (e) {}
      };

      fallbackChannel.onmessage = function (event) {
        handleData(event.data);
      };

      function sendPayload(payload) {
        const str = JSON.stringify(payload);
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(str);
        }
        fallbackChannel.postMessage(payload); // Multi-tab local sync fallback
      }

      function updateRemotePlayer(data) {
        let pEl = remotePlayers[data.id];
        if (!pEl) {
          pEl = document.createElement("div");
          pEl.className = "player";
          pEl.style.background = "#3742fa"; // Blue for other players
          const label = document.createElement("div");
          label.className = "player-label";
          pEl.appendChild(label);
          document.body.appendChild(pEl);
          remotePlayers[data.id] = pEl;
        }
        pEl.querySelector(".player-label").innerText = data.user;
        pEl.style.top = data.y + "px";
        pEl.style.left = data.x + "px";
      }

      function addChatMessage(user, message) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.innerHTML = `<b>${user}:</b> ${message}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function sendChat() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;

        addChatMessage(username, text);
        sendPayload({ type: "chat", id: playerId, user: username, message: text });

        input.value = "";
        window.focus(); // Force focus back to screen for instant movement
      }

      // MOVEMENT BUG FIX: Listen to the entire window keys properly
      window.addEventListener("keydown", (e) => {
        // Stop movement if typing in the chatbox
        if (document.activeElement === document.getElementById("msgInput")) return;

        const key = e.key.toLowerCase();
        if (key === "arrowup" || key === "w") playerY -= speed;
        if (key === "arrowdown" || key === "s") playerY += speed;
        if (key === "arrowleft" || key === "a") playerX -= speed;
        if (key === "arrowright" || key === "d") playerX += speed;

        const localPlayer = document.getElementById("localPlayer");
        localPlayer.style.top = playerY + "px";
        localPlayer.style.left = playerX + "px";

        sendPayload({ type: "move", id: playerId, user: username, x: playerX, y: playerY });
      });

      document.getElementById("sendBtn").addEventListener("click", sendChat);
      document.getElementById("msgInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendChat();
      });

      // Make sure clicking the grass gives control back to movement
      document.addEventListener("click", (e) => {
        if (e.target.id !== "msgInput" && e.target.id !== "sendBtn") {
          document.getElementById("msgInput").blur();
        }
      });
    </script>
  </body>
</html>
