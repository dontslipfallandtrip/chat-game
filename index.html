<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Game - Green Plot</title>
    <!-- Include the Pusher Library -->
    <script src="https://pusher.com"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #2e8b57; /* The Green Plot floor */
        font-family: sans-serif;
      }

      /* Top Left Chat Box */
      .chat-container {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 300px;
        height: 250px;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        z-index: 100;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .chat-box {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        color: white;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .input-area {
        display: flex;
        border-top: 1px solid #444;
      }
      input {
        flex: 1;
        padding: 10px;
        border: none;
        background: #222;
        color: #fff;
        outline: none;
        font-size: 14px;
      }
      button {
        padding: 10px 15px;
        border: none;
        background: #00ff88;
        color: #121212;
        cursor: pointer;
        font-weight: bold;
      }

      /* The Player Circle */
      .player {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #ff4757; /* Vibrant Red Circle */
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition:
          top 0.1s linear,
          left 0.1s linear; /* Smooth movement */
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .player-label {
        position: absolute;
        top: -25px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- Chat Box in Top Left -->
    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <div>
          <b>System:</b>
          Use Arrow keys or WASD to move your circle!
        </div>
      </div>
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Press Enter to chat..." autofocus="" />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <!-- Your Player Circle -->
    <div class="player" id="localPlayer" style="top: 300px; left: 400px">
      <div class="player-label" id="localLabel">Hero</div>
    </div>

    <script>
      // 1. Get player name
      const username = prompt("Enter your Name:") || "Hero";
      document.getElementById("localLabel").innerText = username;

      // 2. Initialize Pusher (PUT YOUR KEYS HERE)
      const pusher = new Pusher("YOUR_PUSHER_KEY_HERE", {
        cluster: "YOUR_CLUSTER_HERE",
        forceTLS: true,
      });

      const channel = pusher.subscribe("game-room");

      // Listen for chat messages from others
      channel.bind("chat-msg", function (data) {
        addChatMessage(data.user, data.message);
      });

      // Helper to add chat to the top-left box
      function addChatMessage(user, message) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.innerHTML = `<b>${user}:</b> ${message}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // Handle sending chat messages
      function sendChat() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;

        // Display locally instantly
        addChatMessage(username, text);
        input.value = "";
        input.blur(); // Unfocus so arrow keys work for moving again
      }

      // 3. Movement Logic (Arrow keys & WASD)
      const player = document.getElementById("localPlayer");
      let playerX = 400;
      let playerY = 300;
      const speed = 15;

      window.addEventListener("keydown", (e) => {
        // If the user is actively typing in the chat input, don't move the circle
        if (document.activeElement === document.getElementById("msgInput")) return;

        if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") playerY -= speed;
        if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") playerY += speed;
        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") playerX -= speed;
        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") playerX += speed;

        // Apply new coordinates to the circle
        player.style.top = playerY + "px";
        player.style.left = playerX + "px";
      });

      // Chat Event Listeners
      document.getElementById("sendBtn").addEventListener("click", sendChat);
      document.getElementById("msgInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendChat();
      });
    </script>
  </body>
</html>
